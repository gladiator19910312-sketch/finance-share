<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭记账系统(只读分享版)</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zip.js/zip.js@2.7.44/dist/zip.min.js"></script>
<style>
:root{--blue:#2563eb;--red:#dc2626;--green:#16a34a;--amber:#d97706;--bg:#f5f6f8;--line:#e2e5ea;--ink:#1f2430;--sub:#6b7280}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:13px;overflow-x:hidden}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:200}
header h1{font-size:16px;font-weight:700}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{border:none;background:none;padding:7px 12px;cursor:pointer;font-size:13px;border-radius:6px;color:var(--sub);position:relative}
nav button.active{background:var(--blue);color:#fff}
nav button .badge{position:absolute;top:0;right:0;background:var(--red);color:#fff;font-size:10px;border-radius:8px;padding:0 5px;line-height:14px}
main{padding:16px 20px;max-width:1560px;margin:0 auto}
.tab{display:none}.tab.active{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.card h3{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap}
th{background:#f1f3f7;font-weight:600;position:sticky;top:0}
tr:hover td{background:#f8fafc}
.num{text-align:right;font-variant-numeric:tabular-nums}
.over td{background:#fee2e2!important;color:var(--red)}
.tagA{background:#dcfce7;color:#15803d;padding:1px 6px;border-radius:4px;font-size:11px}
.tagS{background:#fef9c3;color:#a16207;padding:1px 6px;border-radius:4px;font-size:11px}
.tagN{background:#fee2e2;color:#b91c1c;padding:1px 6px;border-radius:4px;font-size:11px}
.tagM{background:#e0e7ff;color:#3730a3;padding:1px 6px;border-radius:4px;font-size:11px}
.tagO{background:#f1f5f9;color:#64748b;padding:1px 6px;border-radius:4px;font-size:11px}
tr.rowS td{background:#fefce8}
tr.rowN td{background:#fff1f2}
.btn{background:var(--blue);color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px}
.btn:hover{opacity:.9}.btn.sm{padding:3px 9px;font-size:12px}
.btn.gray{background:#6b7280}.btn.red{background:var(--red)}.btn.green{background:var(--green)}
input,select,textarea{border:1px solid var(--line);border-radius:5px;padding:5px 8px;font-size:13px;font-family:inherit;background:#fff}
textarea{width:100%;min-height:120px;resize:vertical;line-height:1.6}
.stat-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.stat{flex:1;min-width:150px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.stat .lbl{color:var(--sub);font-size:12px}
.stat .val{font-size:20px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .val.red{color:var(--red)}.stat .val.green{color:var(--green)}.stat .val.blue{color:var(--blue)}
.bar{height:8px;background:#eef0f4;border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:4px}
.bar.over>i{background:var(--red)}
.chart{width:100%;height:320px}
.chart.sm{height:260px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:1000px){.grid2,.grid3{grid-template-columns:1fr}}
.muted{color:var(--sub);font-size:12px}
.scroll{overflow:auto;max-height:560px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:100}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:10px;padding:20px;width:720px;max-width:94vw;max-height:88vh;overflow:auto}
.modal h3{margin-bottom:12px}
.kbd{background:#eef0f4;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11px;font-family:monospace}
.insight{padding:8px 12px;border-left:3px solid var(--blue);background:#eff6ff;margin-bottom:8px;border-radius:0 6px 6px 0;font-size:12.5px;line-height:1.6}
.insight.warn{border-color:var(--amber);background:#fffbeb}
.insight.bad{border-color:var(--red);background:#fef2f2}
.insight.good{border-color:var(--green);background:#f0fdf4}
.help h4{margin:14px 0 6px;font-size:13.5px}
.help p,.help li{line-height:1.8;color:#374151}
.help ul{padding-left:20px}
.help code{background:#eef0f4;padding:1px 5px;border-radius:4px;font-size:12px}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
.pill{padding:2px 8px;border-radius:10px;font-size:11px;background:#eef0f4}
.drop{border:2px dashed var(--line);border-radius:8px;padding:26px;text-align:center;color:var(--sub);cursor:pointer}
.drop:hover{border-color:var(--blue);color:var(--blue)}
/* ===== 月度口语化结论卡 (.mv-) ===== */
.mv-card{border-radius:10px;padding:14px 18px;margin-bottom:12px;border:1px solid transparent}
.mv-card .mv-main{font-size:18px;font-weight:700;line-height:1.5}
.mv-card .mv-tips{margin:8px 0 0 20px;font-size:13px;line-height:1.8;padding:0}
.mv-green{background:#e6f9ee;border-color:#a7e3c0;color:#15803d}
.mv-lite{background:#f2fbf4;border-color:#cdeed8;color:#3f9d63}
.mv-red{background:#fdecec;border-color:#f5b8b8;color:#b91c1c}
.mv-gray{background:#f3f4f6;border-color:#e5e7eb;color:#4b5563}
.mv-orange{background:#fff4e6;border-color:#f5c98a;color:#b35c00}
.mv-card .mv-probs{margin:8px 0 0 20px;font-size:13px;line-height:1.8;padding:0;font-weight:600}
.mv-card .mv-goal{margin-top:10px;padding-top:8px;border-top:1px dashed rgba(0,0,0,.15);font-size:13px}
.mv-card .mv-up{color:#dc2626;font-weight:600}
.mv-card .mv-down{color:#16a34a;font-weight:600}
@media(max-width:720px){.mv-card .mv-main{font-size:16px}.mv-card{padding:12px 14px}}
/* ===== 健康与储蓄 Tab 样式（#tab-hs 隔离） ===== */
#tab-hs{font-size:14px;line-height:1.6;color:#222}
#tab-hs .hs-goal-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:#f0f7ff;border-radius:8px;margin-bottom:18px}
#tab-hs .hs-goal-bar label{font-size:13px;font-weight:600;color:#333}
#tab-hs .hs-goal-bar input[type=number]{width:110px;padding:4px 8px;border:1px solid #ccc;border-radius:4px;font-size:13px}
#tab-hs .hs-goal-bar .btn{font-size:12px;padding:4px 12px}
#tab-hs .hs-stats{display:grid;grid-template-columns:180px 1fr;gap:18px;margin-bottom:22px;align-items:start}
#tab-hs .hs-ring-wrap{display:flex;flex-direction:column;align-items:center}
#tab-hs .hs-ring-wrap svg{width:150px;height:150px}
#tab-hs .hs-ring-label{font-size:12px;color:#555;margin-top:6px;text-align:center}
#tab-hs .hs-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
#tab-hs .hs-card{padding:14px;border-radius:8px;text-align:center}
#tab-hs .hs-card .num{font-size:22px;font-weight:700}
#tab-hs .hs-card .lbl{font-size:11px;color:#555;margin-top:4px}
#tab-hs .hs-card.green{background:#e8f8ee;color:#1a7a42}
#tab-hs .hs-card.orange{background:#fff4e6;color:#b35c00}
#tab-hs .hs-card.red{background:#fde8e8;color:#b91c1c}
#tab-hs .hs-warn{color:#b91c1c;font-size:13px;font-weight:600;margin:8px 0 18px;padding:8px 12px;background:#fef2f2;border-radius:6px}
#tab-hs h3{font-size:15px;font-weight:700;margin:18px 0 10px;padding-bottom:4px;border-bottom:2px solid #e2e8f0}
#tab-hs .hs-score-list{display:flex;flex-direction:column;gap:8px}
#tab-hs .hs-bar{display:flex;align-items:center;gap:8px}
#tab-hs .hs-bar .dim{width:100px;font-size:12px;font-weight:600;text-align:right;flex-shrink:0}
#tab-hs .hs-bar .track{flex:1;height:22px;background:#f1f5f9;border-radius:4px;position:relative;overflow:hidden}
#tab-hs .hs-bar .fill{height:100%;border-radius:4px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:11px;color:#fff;font-weight:600;transition:width .3s}
#tab-hs .hs-bar .grade{width:28px;font-size:13px;font-weight:700;text-align:center}
#tab-hs .hs-bar .fill.gr-A{background:#16a34a}
#tab-hs .hs-bar .fill.gr-B{background:#f59e0b}
#tab-hs .hs-bar .fill.gr-C{background:#f97316}
#tab-hs .hs-bar .fill.gr-D{background:#dc2626}
#tab-hs .hs-chain-list{display:flex;flex-direction:column;gap:12px}
#tab-hs .hs-chain-card{display:flex;gap:12px;align-items:stretch;padding:12px;background:#fafbfc;border:1px solid #e5e7eb;border-radius:8px}
#tab-hs .hs-chain-card .bar-visual{width:8px;border-radius:4px;flex-shrink:0}
#tab-hs .hs-chain-card .chain-text{flex:1;font-size:13px;line-height:1.6}
#tab-hs .hs-chain-card .chain-text strong{color:#1e40af}
#tab-hs .hs-slider-section{margin:18px 0}
#tab-hs .hs-slider-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
#tab-hs .hs-slider-row label{width:80px;font-size:12px;font-weight:600;text-align:right;flex-shrink:0}
#tab-hs .hs-slider-row input[type=range]{flex:1;max-width:260px}
#tab-hs .hs-slider-row .val{width:50px;font-size:13px;font-weight:600;color:#1e40af}
#tab-hs .hs-slider-result{padding:12px 16px;background:#f0fdf4;border-radius:8px;font-size:13px;margin-top:10px}
#tab-hs .hs-slider-result .highlight{font-size:18px;font-weight:700;color:#16a34a}
#tab-hs table{width:100%;border-collapse:collapse;font-size:12px;margin:10px 0}
#tab-hs th,#tab-hs td{padding:6px 8px;border:1px solid #e5e7eb;text-align:center}
#tab-hs th{background:#f8fafc;font-weight:600}
#tab-hs tr:nth-child(even){background:#fafbfc}
#tab-hs details{margin:14px 0}
#tab-hs summary{cursor:pointer;font-size:13px;font-weight:600;color:#475569;padding:6px 0}
#tab-hs .hs-note{font-size:11px;color:#6b7280;line-height:1.5;padding:10px;background:#f9fafb;border-radius:6px;margin-top:8px}
#tab-hs .hs-loan-inputs{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:12px}
#tab-hs .hs-loan-inputs label{font-size:12px;font-weight:600;color:#333}
#tab-hs .hs-loan-inputs input{width:95px;padding:4px 8px;border:1px solid #ccc;border-radius:4px;font-size:13px}
#tab-hs .hs-card.blue{background:#eff6ff;color:#1e40af}
#tab-hs .hs-card.gray{background:#f1f5f9;color:#475569}
#tab-hs .hs-loan-net{padding:10px 14px;background:#fffbeb;border-radius:8px;font-size:13px;margin:10px 0}
#tab-hs .hs-loan-cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
#tab-hs .hs-loan-cmp .cmp-card{padding:12px;border:1px solid #e5e7eb;border-radius:8px;background:#fafbfc;font-size:13px;line-height:1.7}
#tab-hs .hs-loan-cmp .cmp-card h4{margin:0 0 6px;font-size:13px;color:#1e40af}
#tab-hs .hs-loan-concl{padding:10px 14px;border-radius:8px;font-size:13px;font-weight:600;margin:8px 0}
#tab-hs .hs-loan-concl.good{background:#f0fdf4;color:#15803d}
#tab-hs .hs-loan-concl.bad{background:#fef2f2;color:#b91c1c}
@media(max-width:720px){
  #tab-hs .hs-stats{grid-template-columns:1fr}
  #tab-hs .hs-ring-wrap svg{width:120px;height:120px}
  #tab-hs .hs-cards{grid-template-columns:1fr 1fr}
  #tab-hs .hs-bar .dim{width:70px;font-size:11px}
  #tab-hs .hs-slider-row{flex-wrap:wrap}
  #tab-hs .hs-slider-row input[type=range]{max-width:100%}
  #tab-hs .hs-goal-bar{flex-direction:column;align-items:flex-start}
}
/* ===== 移动端响应式适配（≤768px） ===== */
@media(max-width:768px){
  body{font-size:14px}
  header{padding:8px 12px;gap:8px;flex-wrap:wrap}
  header h1{font-size:15px;white-space:nowrap}
  /* 导航栏：横向滚动pill */
  nav{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:4px;padding-bottom:2px;width:100%;min-width:0;padding-right:12px}
  nav::-webkit-scrollbar{display:none}
  nav button{flex-shrink:0;padding:8px 14px;font-size:13px;min-height:36px}
  /* 主区域 */
  main{padding:10px 10px}
  /* 统计卡片：双列堆叠 */
  .stat-row{gap:8px}
  .stat{min-width:calc(50% - 6px);flex:none;width:calc(50% - 6px);padding:10px 12px}
  .stat .val{font-size:18px}
  .stat .lbl{font-size:11px}
  /* 卡片内表格横向滚动 */
  .card{padding:10px;margin-bottom:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .scroll{max-height:none!important;overflow:visible!important}
  table{font-size:12px;width:max-content;min-width:100%}
  th,td{padding:5px 6px}
  /* 图表高度调整 */
  .chart{height:260px}
  .chart.sm{height:220px}
  /* grid布局单列 */
  .grid2,.grid3{grid-template-columns:1fr;gap:10px}
  /* 工具栏适配 */
  .toolbar{gap:6px;font-size:12px}
  .toolbar select,.toolbar input{font-size:12px;max-width:110px}
  /* 模态框 */
  .modal{width:96vw;padding:14px;border-radius:8px}
  /* 按钮触控友好 */
  .btn{padding:10px 16px;font-size:14px;min-height:44px}
  .btn.sm{padding:8px 12px;font-size:13px;min-height:38px}
  /* insight卡片 */
  .insight{font-size:13px;padding:10px 12px}
  /* 月度工具栏粘性头 */
  #monthBar,#yearBar{padding:6px 8px!important;gap:6px!important;position:relative!important;top:auto!important;z-index:1!important}
  #monthBar label,#yearBar label{font-size:12px}
  /* 网格布局取消左右双栏 */
  #tab-month .grid2,#tab-year .grid2{grid-template-columns:1fr}
  /* 右侧存储信息隐藏 */
  #storageInfo{display:none}
  /* 月度明细过滤器两行排 */
  #tab-month .toolbar select{width:calc(50% - 4px);max-width:none}
}
/* 更窄屏幕（≤420px）进一步缩小 */
@media(max-width:420px){
  header h1{font-size:14px}
  .stat{width:100%;min-width:100%}
  .stat .val{font-size:20px}
  nav button{padding:7px 10px;font-size:12px}
  .chart{height:220px}
  .chart.sm{height:180px}
}
/* ===== 审计中心 Tab 样式（#tab-audit 隔离） ===== */
#tab-audit .au-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:10px}
#tab-audit .au-card{padding:14px;border-radius:8px;text-align:center;border:1px solid transparent}
#tab-audit .au-card .num{font-size:22px;font-weight:700}
#tab-audit .au-card .lbl{font-size:11px;margin-top:4px;opacity:.85}
#tab-audit .au-card.critical{background:#fdf2f2;color:#7f1d1d;border-color:#e8c9c9}
#tab-audit .au-card.error{background:#fdecec;color:#dc2626;border-color:#f5b8b8}
#tab-audit .au-card.warn{background:#fff4e6;color:#b35c00;border-color:#f5c98a}
#tab-audit .au-card.info{background:#eef2f7;color:#475569;border-color:#d7dfe9}
#tab-audit .au-card.green{background:#e8f8ee;color:#1a7a42;border-color:#a7e3c0}
#tab-audit .au-card.blue{background:#eff6ff;color:#2563eb;border-color:#bfdbfe}
#tab-audit .au-meta{margin-bottom:12px}
#tab-audit .au-sev{padding:1px 7px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap}
#tab-audit .au-sev.critical{background:#7f1d1d;color:#fff}
#tab-audit .au-sev.error{background:#dc2626;color:#fff}
#tab-audit .au-sev.warn{background:#fff4e6;color:#b35c00}
#tab-audit .au-sev.info{background:#eef2f7;color:#475569}
#tab-audit .au-tag{padding:1px 6px;border-radius:8px;font-size:10px;margin-left:4px;white-space:nowrap}
#tab-audit .au-tag.cf{background:#f3f4f6;color:#6b7280}
#tab-audit .au-tag.live{background:#e0e7ff;color:#3730a3}
#tab-audit .au-tag.new{background:#fee2e2;color:#b91c1c}
#tab-audit tr.au-row{cursor:pointer}
#tab-audit tr.au-detail{display:none}
#tab-audit tr.au-detail.show{display:table-row}
#tab-audit tr.au-detail td{white-space:normal;background:#f8fafc;color:#475569;font-size:12px;line-height:1.6}
#tab-audit td.au-sum{white-space:normal;max-width:420px}
#tab-audit details.au-fold summary{cursor:pointer;font-size:13px;font-weight:600;padding:6px 0;color:#475569}
#tab-audit .au-trbar{display:inline-block;height:8px;background:#f59e0b;border-radius:4px;vertical-align:middle;min-width:2px}
#tab-audit .au-trbar.bad{background:#dc2626}
#tab-audit .au-empty{text-align:center;color:#6b7280;padding:40px 20px;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>家庭记账系统 <span style="font-size:13px;color:#888">(只读分享版)</span></h1>
  <nav id="nav">
    <button data-tab="month" class="active">月度</button>
    <button data-tab="year">年度</button>
    <button data-tab="analysis">财务分析</button>
    <button data-tab="member">成员贡献度</button>
    <button data-tab="pending">待标注<span class="badge" id="pendingBadge" style="display:none"></span></button>
    <button data-tab="rules">规则库</button>
    <button data-tab="import">导入</button>
    <button data-tab="data">数据管理</button>
    <button data-tab="hs">健康与储蓄</button>
    <button data-tab="audit">审计中心<span class="badge" id="auditBadge" style="display:none"></span></button>
    <button data-tab="help">帮助</button>
    <button id="aiSyncBtn" onclick="connectAISync()" style="background:#eef4ff;border:1px solid #93b4f5;border-radius:6px" title="首次点击选择Finance文件夹授权,之后编辑保存自动同步给AI">🔗 连接AI同步</button>
  </nav>
  <span class="right muted" id="storageInfo"></span>
</header>
<main>
  <div id="dataCoverage" class="card" style="display:none;background:#fff8e6;border:1px solid #edcf83;margin-bottom:14px"></div>
  <section id="tab-month" class="tab active"></section>
  <section id="tab-year" class="tab"></section>
  <section id="tab-analysis" class="tab"></section>
  <section id="tab-member" class="tab"></section>
  <section id="tab-pending" class="tab"></section>
  <section id="tab-rules" class="tab"></section>
  <section id="tab-import" class="tab"></section>
  <section id="tab-data" class="tab"></section>
  <section id="tab-hs" class="tab"></section>
  <section id="tab-audit" class="tab"></section>
  <section id="tab-help" class="tab"></section>
</main>

<!-- 集中确认模式弹窗 -->
<div class="modal-mask" id="confirmMask">
  <div class="modal" id="confirmBox"></div>
</div>
<!-- 手工录入/编辑弹窗 -->
<div class="modal-mask" id="editMask">
  <div class="modal" id="editBox"></div>
</div>

function b64(s){const b=atob(s);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function unsupportedCompression(message){const e=new Error(message);e.code='UNSUPPORTED_COMPRESSION';return e;}
async function decodePayload(bytes){
  if(!ENC.compression)return bytes; // 兼容旧版未压缩密文（无compression字段）
  if(ENC.compression!=='gzip')throw unsupportedCompression('当前分享版压缩格式不受支持，请更新浏览器后重试');
  if(typeof DecompressionStream!=='function')throw unsupportedCompression('当前浏览器不支持gzip解压，请更新浏览器后重试');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
let busy=false;
async function unlock(){
  if(busy)return; busy=true;
  const err=document.getElementById('__GERR__');
  const pwd=document.getElementById('__GPWD__').value;
  if(!pwd){err.textContent='请输入密码';busy=false;return;}
  err.style.color='#667';err.textContent='解密中…';
  await new Promise(r=>setTimeout(r,30));
  try{
    if(ENC.compression && ENC.compression!=='gzip')throw unsupportedCompression('当前分享版压缩格式不受支持，请更新浏览器后重试');
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pwd),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.ct));
    const decoded=await decodePayload(pt);
    const s=document.createElement('script');s.textContent=new TextDecoder().decode(decoded);
    document.getElementById('__GATE__').remove();
    document.body.appendChild(s);
  }catch(e){
    if(e&&e.code==='UNSUPPORTED_COMPRESSION'){
      err.style.color='#a15'; err.textContent=e.message;
    }else{ err.style.color='#d33'; err.textContent='密码错误，请重试'; }
  }
  busy=false;
}
document.getElementById('__GBTN__').onclick=unlock;
document.getElementById('__GPWD__').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
if(!(window.crypto&&crypto.subtle))document.getElementById('__GERR__').textContent='当前浏览器不支持解密，请换较新的浏览器打开';
})();
</script>
